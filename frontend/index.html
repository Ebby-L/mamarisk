<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MamaRisk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --ink: #1f2a2e; --muted: #5d6b70; --line: #e3ddd3;
    --accent: #1d6b62; --low: #2f7d4f; --mid: #c27c12; --high: #b3362f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 34px; margin: 0; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin: 4px 0 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 16px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label { font-size: 13px; font-weight: 500; display: block; }
  label span { color: var(--muted); font-weight: 400; }
  input { width: 100%; margin-top: 4px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fbfaf8; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { margin-top: 18px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: 600 15px Inter, sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .verdict { font-family: Fraunces, Georgia, serif; font-size: 30px; text-transform: capitalize; margin: 0 0 18px; }
  .bar { margin-bottom: 12px; }
  .bar-top { display: flex; justify-content: space-between; font-size: 13px; text-transform: capitalize; }
  .track { height: 8px; background: #efebe4; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .fill { height: 100%; border-radius: 4px; transition: width .4s ease; }
  .empty { color: var(--muted); }
  .error { color: var(--high); font-size: 14px; margin-top: 12px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
// Served by FastAPI at "/", so the API is on the same origin. Change if hosted separately.
const API = "";
const COLORS = { "low risk": "var(--low)", "mid risk": "var(--mid)", "high risk": "var(--high)" };
const FIELDS = [
  ["Age", "Age", "years", 1], ["HeartRate", "Heart rate", "bpm", 1],
  ["SystolicBP", "Systolic BP", "mmHg", 1], ["DiastolicBP", "Diastolic BP", "mmHg", 1],
  ["BS", "Blood glucose", "mmol/L", 0.1], ["BodyTemp", "Body temp", "°F", 0.1],
];

function App() {
  const [form, setForm] = useState({ Age: 28, SystolicBP: 120, DiastolicBP: 80, BS: 7.0, BodyTemp: 98.0, HeartRate: 76 });
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault(); setBusy(true); setError("");
    try {
      const res = await fetch(`${API}/predict`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.fromEntries(Object.entries(form).map(([k, v]) => [k, Number(v)]))),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Check the values entered.");
      setResult(data);
    } catch (err) { setError(err.message); setResult(null); }
    finally { setBusy(false); }
  }

  return (
    <main>
      <h1>MamaRisk</h1>
      <p className="sub">Maternal health risk screening from routine vital signs.</p>
      <div className="grid">
        <form className="card" onSubmit={submit}>
          <h2>Patient vitals</h2>
          <div className="fields">
            {FIELDS.map(([key, name, unit, step]) => (
              <label key={key}>{name} <span>{unit}</span>
                <input type="number" step={step} required value={form[key]}
                  onChange={e => setForm({ ...form, [key]: e.target.value })} />
              </label>
            ))}
          </div>
          <button disabled={busy}>{busy ? "Assessing…" : "Assess risk"}</button>
          {error && <p className="error">{error}</p>}
        </form>
        <section className="card" aria-live="polite">
          <h2>Assessment</h2>
          {!result ? <p className="empty">Enter vitals and run an assessment.</p> : (<>
            <p className="verdict" style={{ color: COLORS[result.risk_level] }}>{result.risk_level}</p>
            {Object.entries(result.probabilities).map(([cls, p]) => (
              <div className="bar" key={cls}>
                <div className="bar-top"><span>{cls}</span><span>{Math.round(p * 100)}%</span></div>
                <div className="track"><div className="fill" style={{ width: `${p * 100}%`, background: COLORS[cls] }} /></div>
              </div>
            ))}
            <p className="note">{result.model} · {result.disclaimer}</p>
          </>)}
        </section>
      </div>
    </main>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
